[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coldsend-lint"
version = "0.1.0"
description = "Lint a cold-email campaign before you send it: DNS deliverability plus CAN-SPAM / GDPR / PECR / LSSI-CE / CASL copy compliance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Waseem Nasir", email = "hello@skynetjoe.com" }]
keywords = ["cold-email", "deliverability", "spf", "dkim", "dmarc", "gdpr", "can-spam", "compliance", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0",
  "dnspython>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/skynetlabs/coldsend-lint"
Issues = "https://github.com/skynetlabs/coldsend-lint/issues"

[project.scripts]
coldsend-lint = "coldsend_lint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["coldsend_lint"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "coldsend_lint/_rules"

[tool.hatch.build.targets.sdist]
include = ["coldsend_lint", "rules", "examples", "tests", "README.md", "LICENSE", "TOPICS.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
